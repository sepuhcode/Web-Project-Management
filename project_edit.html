<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project - SIS Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>SIS Smart Integrator Solution</h1>
                <p>www.sisolusi.com</p>
            </div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="all_projects.html">Active Projects</a>
                <a href="#">Completed Project</a>
                <a href="#">Files</a>
            </nav>
        </div>
    </header>

    <main class="dashboard">
        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb">
            <a href="index.html">Home</a>
            <span class="breadcrumb-separator">></span>
            <a href="all_projects.html">Active Projects</a>
            <span class="breadcrumb-separator">></span>
            <span class="breadcrumb-current">Edit Project</span>
        </nav>

        <!-- Edit Form -->
        <section class="edit-form">
            <div class="form-card">
                <h2>Edit Project Details</h2>
                <form class="project-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="project-name">Project Name</label>
                            <input type="text" id="project-name" name="project-name" value="Tower Bersama Indonesia Group - Bali" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="project-status">Status</label>
                            <select id="project-status" name="project-status">
                                <option value="active" selected>Active</option>
                                <option value="completed">Completed</option>
                                <option value="on-hold">On Hold</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="start-date">Start Date</label>
                            <input type="date" id="start-date" name="start-date" value="2026-01-01" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="end-date">End Date</label>
                            <input type="date" id="end-date" name="end-date" value="2026-03-31" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="team-size">Team Size</label>
                            <input type="number" id="team-size" name="team-size" value="5" min="1" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="project-progress">Overall Progress (%)</label>
                            <input type="number" id="project-progress" name="project-progress" value="45" min="0" max="100" required>
                        </div>
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="project-description">Project Description</label>
                        <textarea id="project-description" name="project-description" rows="4" placeholder="Enter project description...">Installation and integration of smart building systems for Tower Bersama Indonesia Group - Bali location.</textarea>
                    </div>
                    
                    <div class="progress-section">
                        <h3>Stage Progress</h3>
                        <div class="stage-progress-grid">
                            <div class="form-group">
                                <label for="survey-progress">Survey (%)</label>
                                <input type="number" id="survey-progress" name="survey-progress" value="100" min="0" max="100">
                            </div>
                            
                            <div class="form-group">
                                <label for="installation-progress">Installation (%)</label>
                                <input type="number" id="installation-progress" name="installation-progress" value="85" min="0" max="100">
                            </div>
                            
                            <div class="form-group">
                                <label for="programming-progress">Programming (%)</label>
                                <input type="number" id="programming-progress" name="programming-progress" value="10" min="0" max="100">
                            </div>
                            
                            <div class="form-group">
                                <label for="testing-progress">Testing (%)</label>
                                <input type="number" id="testing-progress" name="testing-progress" value="0" min="0" max="100">
                            </div>
                            
                            <div class="form-group">
                                <label for="training-progress">Training (%)</label>
                                <input type="number" id="training-progress" name="training-progress" value="0" min="0" max="100">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save Changes</button>
                        <button type="button" class="btn-secondary" onclick="window.history.back()">Cancel</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
